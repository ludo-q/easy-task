<section>
    <header>
        @if(userName(); as name) {
            <h2>{{name}}'s Tasks</h2>
            <menu>
                <button>Add Task</button>
            </menu>
        } @else {
            <h2>Select a user to see their tasks!</h2>
        }
    </header>

    <ul>
        @for (task of selectedUserTasks(); track task.id) {
            <li><app-task-item [task]="task"/></li>
        }
    </ul>
</section>
