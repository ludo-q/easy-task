<app-header />

<main>
    <nav>
        <ul class="users">
            @for (user of users; track user.id) {
                <li> 
                    <app-user 
                        [user]="user" 
                        (onSelected)="onSelectedUser($event)"
                    /> 
                </li>
            }
        </ul>
    </nav>
    @if (selectedUser(); as user) {
        <app-task [userName]="user.name"></app-task>
    } @else {
        <h2>
            Select a user to see their tasks!
        </h2>
    }
</main>
